<!DOCTYPE html>
<html>

<head>
    <title>SKU Generator</title>

    <link rel="stylesheet" href="style.css">

    <script type="module"
        src="https://pyscript.net/releases/2024.11.1/core.js">
    </script>
</head>

<body>

    <nav>
        <b style="color:white;">☕ OBMC Entrep Fair</b>

        <div>
            <a href="index.html">SKU Generator</a>
            <a href="receipt.html">Receipt Generator</a>
        </div>
    </nav>

    <div class="container">

        <h1>📦 SKU Generator</h1>

        <h2>Create a unique product code</h2>

        <h3>Product Category</h3>

        <input
            type="text"
            id="category"
            placeholder="Example: Coffee"
        >

        <h3>Product Name</h3>

        <input
            type="text"
            id="product_name"
            placeholder="Example: Americano"
        >

        <h3>Stock Quantity</h3>

        <input
            type="number"
            id="quantity"
            placeholder="Example: 20"
        >

        <button py-click="SKU_generator">
            Generate SKU
        </button>

        <div id="sku_output"></div>

    </div>

    <script type="py" src="./main.py"></script>

</body>

</html>
